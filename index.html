<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PS99 Tracker</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131a;
      color: white;
    }

    header {
      background: #181d27;
      padding: 25px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      color: #b9c2d0;
      margin: 0 15px;
      text-decoration: none;
    }

    main {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #333b49;
      background: #181d27;
      color: white;
      font-size: 16px;
    }

    .card {
      background: #181d27;
      margin-top: 30px;
      padding: 25px;
      border-radius: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #303746;
    }
  </style>
</head>

<body>

<header>
  <h1>PS99 Tracker</h1>

  <nav>
    <a href="#">Players</a>
    <a href="#">Leagues</a>
    <a href="#">Clans</a>
  </nav>
</header>

<main>

 <input
  id="leagueSearch"
  class="search"
  type="text"
  placeholder="Search for a league..."
>

  <div class="card">

    <h2>League Leaderboard</h2>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>League</th>
      <th>Points</th>
      <th>Members</th>
    </tr>
  </thead>

  <tbody id="leaderboard">
    <tr>
      <td colspan="4">Loading PS99 leagues...</td>
    </tr>
  </tbody>
</table>

  </div>

</main>

  <script>
  const leaderboard = document.getElementById("leaderboard");
  const searchInput = document.getElementById("leagueSearch");

  async function loadLeagues(search = "") {
    leaderboard.innerHTML = `
      <tr>
        <td colspan="4">Loading...</td>
      </tr>
    `;

    try {
      let url;

      if (search.trim() === "") {
        // No search: show Top 100
        url =
          "https://ps99.biggamesapi.io/v1/leagues?page=1&pageSize=100&sort=Points&sortOrder=desc";
      } else {
        // Search all PS99 leagues
        url =
          "https://ps99.biggamesapi.io/v1/leagues?page=1&pageSize=100&sort=Points&sortOrder=desc&search=" +
          encodeURIComponent(search.trim());
      }

      const response = await fetch(url);
      const result = await response.json();

      const leagues = result.data.leagues;

      leaderboard.innerHTML = "";

      if (leagues.length === 0) {
        leaderboard.innerHTML = `
          <tr>
            <td colspan="4">No leagues found.</td>
          </tr>
        `;
        return;
      }

      leagues.forEach((league, index) => {
        const row = document.createElement("tr");

        row.innerHTML = `
  <td>${index + 1}</td>
  <td>
    <a
      href="#"
      onclick="showLeague('${league.Name.replace(/'/g, "\\'")}'); return false;"
      style="color: white; font-weight: bold;"
    >
      ${league.Name}
    </a>
  </td>
  <td>${league.Points.toLocaleString()}</td>
  <td>${league.Members}/${league.MemberCapacity}</td>
`;

        leaderboard.appendChild(row);
      });

    } catch (error) {
      console.error(error);

      leaderboard.innerHTML = `
        <tr>
          <td colspan="4">Could not load PS99 data.</td>
        </tr>
      `;
    }
  }

  let searchTimer;

  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {
      loadLeagues(searchInput.value);
    }, 400);
  });

async function showLeague(name) {
  leaderboard.innerHTML = `
    <tr>
      <td colspan="4">Loading ${name}...</td>
    </tr>
  `;

  try {
    // Hent league-data fra PS99
    const response = await fetch(
      "https://ps99.biggamesapi.io/v1/leagues/" +
      encodeURIComponent(name)
    );

    const result = await response.json();
    const league = result.data;

    leaderboard.innerHTML = `
      <tr>
        <th>Player</th>
        <th>Points</th>
        <th colspan="2">Role</th>
      </tr>
    `;

    for (const player of league.PointContributions) {

      // Hent Roblox-navnet ved hjelp av UserID
      let username = player.UserID;

      try {
        const robloxResponse = await fetch(
          "https://users.roblox.com/v1/users/" + player.UserID
        );

        if (robloxResponse.ok) {
          const robloxUser = await robloxResponse.json();

          username = robloxUser.name;
        }

      } catch (error) {
        console.log(
          "Could not get Roblox username for",
          player.UserID
        );
      }

      const isOwner =
        league.Owner &&
        league.Owner.UserID === player.UserID;

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>
          <strong>${username}</strong>
        </td>

        <td>
          ${player.Points.toLocaleString()}
        </td>

        <td colspan="2">
          ${isOwner ? "Owner 👑" : "Member"}
        </td>
      `;

      leaderboard.appendChild(row);
    }

    const backRow = document.createElement("tr");

    backRow.innerHTML = `
      <td colspan="4" style="padding-top: 25px;">
        <button onclick="loadLeagues()">
          ← Back to leaderboard
        </button>
      </td>
    `;

    leaderboard.appendChild(backRow);

  } catch (error) {
    console.error(error);

    leaderboard.innerHTML = `
      <tr>
        <td colspan="4">
          Could not load league.
        </td>
      </tr>
    `;
  }
}
    
  loadLeagues();
</script>
  
</body>
</html>
