<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PS99 Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #4b2940;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, #ffffff 0, transparent 20%),
        linear-gradient(135deg, #fff4fa, #ffd9eb);
    }

    /* HEADER */

    header {
      text-align: center;
      padding: 38px 20px 30px;
      background: rgba(255, 255, 255, 0.55);
      border-bottom: 1px solid #ffc4df;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 44px;
      color: #ff4f9a;
      text-shadow: 0 3px 0 white;
    }

    .subtitle {
      margin-top: 8px;
      color: #c66b94;
      font-size: 14px;
    }

    nav {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    nav a {
      color: #9e4e75;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 22px;
      border-radius: 999px;
      transition: 0.2s;
    }

    nav a:hover,
    nav a.active {
      background: #ff69aa;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 80, 155, 0.25);
    }

    /* MAIN */

    main {
      max-width: 1050px;
      margin: 40px auto;
      padding: 0 20px 50px;
    }

    /* SEARCH */

    .search-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
    }

    .search {
      width: 100%;
      padding: 18px 20px 18px 55px;
      border-radius: 18px;
      border: 2px solid #ffc2dc;
      background: rgba(255,255,255,0.9);
      color: #5b3047;
      font-size: 16px;
      outline: none;
      box-shadow: 0 8px 25px rgba(220, 90, 150, 0.10);
      transition: 0.2s;
    }

    .search:focus {
      border-color: #ff69aa;
      box-shadow: 0 8px 30px rgba(255, 80, 155, 0.20);
    }

    .search::placeholder {
      color: #c58aa5;
    }

    /* CARD */

    .card {
      background: rgba(255,255,255,0.88);
      margin-top: 28px;
      padding: 28px;
      border-radius: 24px;
      border: 1px solid #ffd0e4;
      box-shadow: 0 15px 40px rgba(184, 74, 125, 0.12);
      overflow: hidden;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .crown {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background: #ffe2ef;
      font-size: 24px;
    }

    h2 {
      margin: 0;
      font-size: 26px;
      color: #4a2940;
    }

    .small-text {
      color: #c26c94;
      margin-top: 4px;
      font-size: 14px;
    }

    /* TABLE */

    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #f7d5e4;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th {
      background: #fff0f7;
      color: #9e4c73;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    th, td {
      padding: 17px 15px;
      text-align: left;
      border-bottom: 1px solid #f5dbe7;
    }

    tbody tr {
      transition: 0.15s;
    }

    tbody tr:hover {
      background: #fff4f9;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* LEAGUE LINKS */

    .league-link {
      color: #f34f96;
      font-weight: bold;
      text-decoration: none;
    }

    .league-link:hover {
      color: #d72e7a;
      text-decoration: underline;
    }

    /* RANKS */

    .rank {
      font-weight: bold;
    }

    .rank-1 {
      font-size: 20px;
    }

    /* BUTTON */

    button {
      border: none;
      background: linear-gradient(135deg, #ff75b2, #f34f96);
      color: white;
      padding: 13px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(230, 65, 140, 0.25);
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 20px rgba(230, 65, 140, 0.32);
    }

    /* FOOTER */

    footer {
      text-align: center;
      color: #bc6c91;
      padding: 30px 20px 45px;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      header {
        padding-top: 28px;
      }

      h1 {
        font-size: 34px;
      }

      main {
        margin-top: 25px;
        padding-left: 12px;
        padding-right: 12px;
      }

      .card {
        padding: 17px;
        border-radius: 20px;
      }

      h2 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>PS99 Tracker ♡</h1>

  <div class="subtitle">
    ✨ Track • Compare • Climb ✨
  </div>

  <nav>
    <a href="#">Players</a>
    <a href="#" class="active">Leagues</a>
    <a href="#">Clans</a>
  </nav>

</header>

<main>

  <div class="search-wrapper">

    <span class="search-icon">🔎</span>

    <input
      id="leagueSearch"
      class="search"
      type="text"
      placeholder="Search for a league..."
    >

  </div>

  <div class="card">

    <div class="card-title">

      <div class="crown">
        👑
      </div>

      <div>
        <h2>League Leaderboard</h2>
        <div class="small-text">
          Top PS99 Leagues ♡
        </div>
      </div>

    </div>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>League</th>
            <th>Points</th>
            <th>Members</th>
          </tr>
        </thead>

        <tbody id="leaderboard">

          <tr>
            <td colspan="4">
              Loading PS99 leagues... ♡
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</main>

<footer>
  ♡ PS99 Tracker • Made for the PS99 community ♡
</footer>


<script>

  const leaderboard =
    document.getElementById("leaderboard");

  const searchInput =
    document.getElementById("leagueSearch");


  async function loadLeagues(search = "") {

    leaderboard.innerHTML = `
      <tr>
        <td colspan="4">
          Loading leagues... ♡
        </td>
      </tr>
    `;

    try {

      let url;

      if (search.trim() === "") {

        url =
          "https://ps99.biggamesapi.io/v1/leagues?page=1&pageSize=100&sort=Points&sortOrder=desc";

      } else {

        url =
          "https://ps99.biggamesapi.io/v1/leagues?page=1&pageSize=100&sort=Points&sortOrder=desc&search=" +
          encodeURIComponent(search.trim());

      }


      const response = await fetch(url);

      const result = await response.json();

      const leagues = result.data.leagues;


      leaderboard.innerHTML = "";


      if (leagues.length === 0) {

        leaderboard.innerHTML = `
          <tr>
            <td colspan="4">
              No leagues found ♡
            </td>
          </tr>
        `;

        return;
      }


      leagues.forEach((league, index) => {

        const row =
          document.createElement("tr");


        let rank = index + 1;

        let rankDisplay = rank;


        if (search.trim() === "") {

          if (rank === 1) {
            rankDisplay = "🥇";
          }

          if (rank === 2) {
            rankDisplay = "🥈";
          }

          if (rank === 3) {
            rankDisplay = "🥉";
          }

        }


        row.innerHTML = `

          <td class="rank">
            ${rankDisplay}
          </td>

          <td>

            <a
              href="#"
              class="league-link"
              onclick="showLeague('${league.Name.replace(/'/g, "\\'")}'); return false;"
            >
              ${league.Name}
            </a>

          </td>

          <td>
            ${league.Points.toLocaleString()}
          </td>

          <td>
            ${league.Members}/${league.MemberCapacity}
          </td>

        `;


        leaderboard.appendChild(row);

      });


    } catch (error) {

      console.error(error);

      leaderboard.innerHTML = `
        <tr>
          <td colspan="4">
            Could not load PS99 data.
          </td>
        </tr>
      `;

    }

  }



  let searchTimer;


  searchInput.addEventListener("input", () => {

    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {

      loadLeagues(searchInput.value);

    }, 400);

  });



  async function showLeague(name) {

    leaderboard.innerHTML = `
      <tr>
        <td colspan="4">
          Loading ${name}... ♡
        </td>
      </tr>
    `;


    try {

      const response = await fetch(

        "https://ps99.biggamesapi.io/v1/leagues/" +
        encodeURIComponent(name)

      );


      const result =
        await response.json();

      const league =
        result.data;

      const players =
        league.PointContributions;


      const userIds =
        players.map(player =>
          Number(player.UserID)
        );


      const robloxUsers = {};


      try {

        const robloxResponse = await fetch(

          "https://users.roblox.com/v1/users",

          {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              userIds: userIds,

              excludeBannedUsers: false

            })

          }

        );


        if (robloxResponse.ok) {

          const robloxResult =
            await robloxResponse.json();


          robloxResult.data.forEach(user => {

            robloxUsers[user.id] =
              user;

          });

        }


      } catch (error) {

        console.log(
          "Roblox usernames could not be loaded."
        );

      }



      leaderboard.innerHTML = `

        <tr>

          <th>Player</th>

          <th>Points</th>

          <th colspan="2">
            Role
          </th>

        </tr>

      `;



      players.forEach(player => {


        const robloxUser =
          robloxUsers[
            Number(player.UserID)
          ];


        const username =
          robloxUser
            ? robloxUser.name
            : player.UserID;


        const displayName =
          robloxUser
            ? robloxUser.displayName
            : "";


        const isOwner =
          league.Owner &&
          Number(league.Owner.UserID) ===
          Number(player.UserID);


        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>

            <strong>
              ${displayName || username}
            </strong>

            ${
              displayName &&
              displayName !== username

                ? `<br>
                   <small>
                     @${username}
                   </small>`

                : ""
            }

          </td>


          <td>

            ${player.Points.toLocaleString()}

          </td>


          <td colspan="2">

            ${
              isOwner
                ? "👑 Owner"
                : "♡ Member"
            }

          </td>

        `;


        leaderboard.appendChild(row);

      });



      const backRow =
        document.createElement("tr");


      backRow.innerHTML = `

        <td
          colspan="4"
          style="padding-top: 25px;"
        >

          <button onclick="loadLeagues()">

            ← Back to Leaderboard ♡

          </button>

        </td>

      `;


      leaderboard.appendChild(
        backRow
      );


    } catch (error) {


      console.error(error);


      leaderboard.innerHTML = `

        <tr>

          <td colspan="4">

            Could not load league.

          </td>

        </tr>

      `;

    }

  }


  loadLeagues();

</script>

</body>
</html>
